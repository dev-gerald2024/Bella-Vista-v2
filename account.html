<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Account | Bella Vista Oasis Spa</title>
    <meta name="description" content="Manage your Bella Vista Oasis Spa reservations, payments and profile." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="assets/logo/logo.png" type="image/png" />
    <link rel="stylesheet" href="css/fonts.css?v=m1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tokens.css?v=m1" />
    <link rel="stylesheet" href="css/account.css?v=m1" />
  </head>
  <body>
    <header class="ph">
      <div class="w bar">
        <a class="lg" href="index.html" aria-label="Bella Vista Oasis Spa, home">
          <img src="assets/logo/logo.png" alt="Bella Vista Oasis Spa" />
        </a>
        <nav class="ln" aria-label="Account">
          <span
            class="acc-badge"
            id="accBadge"
            style="
              display: inline-flex;
              align-items: center;
              gap: 6px;
              font-size: 0.82rem;
              color: var(--iv);
              background: rgba(255, 255, 255, 0.1);
              padding: 5px 12px;
              border-radius: 20px;
              border: 1px solid rgba(197, 164, 109, 0.4);
            "
          >
            Signed in:
            <strong id="accName">Account</strong>
            &bull;
            <span id="accEmail"></span>
            &bull;
            <small id="accCid" style="color: var(--gold)"></small>
          </span>
          <a class="hm" href="index.html">Home</a>
          <a class="btn sm" href="contact.html#booking">Book now</a>
          <button type="button" id="out">Logout</button>
        </nav>
      </div>
      <div class="w hero">
        <h1>My Account</h1>
        <p id="wl">Welcome back</p>
        <p id="wlSub" style="font-size: 0.9rem; opacity: 0.9; margin-top: 2px">
          Customer:
          <strong id="heroAccName"></strong>
          &bull;
          <span id="heroAccEmail"></span>
          &bull; ID:
          <span id="heroAccCid" style="color: var(--gold); font-weight: 600"></span>
        </p>
      </div>
    </header>
    <nav class="tabs" id="tabs" aria-label="Account sections"><div class="w"></div></nav>
    <main class="w" id="m"></main>
    <footer class="acc-footer">
      <div class="w">
        <span>&copy; 2026 Bella Vista Oasis Spa &bull; All rights reserved.</span>
        <div>
          <a href="index.html">Home</a>
          <a href="services.html">Services</a>
          <a href="accommodations.html">Accommodations</a>
          <a href="contact.html">Contact Us</a>
        </div>
      </div>
    </footer>
    <dialog id="dlg" aria-labelledby="dt">
      <button type="button" class="dlg-x" data-a="close" aria-label="Close dialog" title="Close modal">&times;</button>
      <h3 id="dt"></h3>
      <div id="db"></div>
    </dialog>
    <div id="vb" role="status"></div>
    <script src="js/notify.js?v=m1"></script>
    <script src="js/auth.js?v=m1"></script>
    <script src="js/db.js?v=m1"></script>
    <script src="js/phone.js?v=m1"></script>
    <script src="js/account.js?v=m1"></script>
  </body>
</html>
