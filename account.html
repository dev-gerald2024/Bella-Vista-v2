<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Account | Bella Vista Oasis Spa</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="assets/logo/logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --forest: #203a2a;
        --deep: #14271c;
        --sage: #71806d;
        --gold: #c5a46d;
        --gd: #8a6a28;
        --iv: #f8f4ea;
        --cr: #ede5d6;
        --ink: #20251f;
        --mut: #4a5a4d;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          300 1rem/1.65 Jost,
          system-ui,
          sans-serif;
        color: var(--ink);
        background: var(--iv);
        overflow-x: hidden;
      }
      h1,
      h2,
      h3 {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-weight: 500;
        color: var(--forest);
        margin: 0;
        line-height: 1.1;
      }
      h2 {
        font-size: clamp(1.7rem, 3vw, 2.2rem);
        margin: 0 0 18px;
      }
      a {
        color: var(--forest);
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 3px;
      }
      .w {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 clamp(18px, 4vw, 40px);
      }
      .eb {
        display: block;
        font: 500 0.72rem Jost;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 12px;
      }
      /* header */
      .ph {
        background: var(--deep);
        color: var(--iv);
        position: relative;
        overflow: hidden;
        padding-bottom: clamp(36px, 6vw, 64px);
      }
      .ph::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 50% 90% at 90% 0, rgba(113, 128, 109, 0.45), transparent),
          radial-gradient(ellipse 40% 60% at 0 100%, rgba(197, 164, 109, 0.14), transparent);
      }
      .bar {
        position: relative;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 18px;
        padding-bottom: 18px;
      }
      .lg img {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        box-shadow: 0 0 0 1px rgba(197, 164, 109, 0.7);
        display: block;
      }
      .ln {
        display: flex;
        align-items: center;
        gap: 22px;
        font-size: 0.88rem;
      }
      .ln a:not(.btn),
      .ln button {
        color: var(--iv);
        background: none;
        border: 0;
        text-decoration: none;
        padding: 8px 0;
        min-height: 44px;
      }
      .ln a:not(.btn):hover,
      .ln button:hover {
        color: var(--gold);
      }
      .hero {
        position: relative;
        animation: up 0.9s var(--ease) both;
        padding-top: clamp(18px, 4vw, 40px);
      }
      .hero h1 {
        color: var(--iv);
        font-size: clamp(2.4rem, 6vw, 4.4rem);
      }
      .hero p {
        margin: 10px 0 0;
        color: #dcd8c6;
        font-size: 1.1rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: var(--gold);
        color: var(--deep);
        font: 500 0.76rem Jost;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 12px 22px;
        min-height: 46px;
        border: 1px solid var(--gold);
        border-radius: 2px;
        text-decoration: none;
        transition:
          transform 0.3s var(--ease),
          background 0.3s,
          box-shadow 0.3s;
      }
      .btn:hover {
        transform: translateY(-2px);
        background: #d4b374;
        box-shadow: 0 8px 20px rgba(20, 39, 28, 0.15);
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn.line {
        background: none;
        color: var(--forest);
        border-color: rgba(32, 58, 42, 0.5);
      }
      .btn.line:hover {
        background: var(--forest);
        color: #fff;
      }
      .btn.sm {
        padding: 8px 16px;
        min-height: 40px;
      }
      .btn.dg:hover {
        background: #8a2f2f;
        border-color: #8a2f2f;
        color: #fff;
      }
      /* tabs */
      .tabs {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(250, 247, 239, 0.94);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(197, 164, 109, 0.45);
      }
      .tabs .w {
        display: flex;
        gap: clamp(18px, 3vw, 36px);
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tabs a {
        position: relative;
        white-space: nowrap;
        padding: 16px 0;
        text-decoration: none;
        font-size: 0.9rem;
        color: var(--mut);
        transition: color 0.3s;
      }
      .tabs a::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 2px;
        background: var(--gold);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.35s var(--ease);
      }
      .tabs a:hover,
      .tabs a[aria-current] {
        color: var(--forest);
      }
      .tabs a[aria-current]::after,
      .tabs a:hover::after {
        transform: scaleX(1);
      }
      .dot {
        display: inline-block;
        min-width: 18px;
        padding: 0 5px;
        margin-left: 6px;
        border-radius: 9px;
        background: var(--gold);
        color: var(--deep);
        font-size: 0.68rem;
        text-align: center;
      }
      main {
        padding-top: clamp(28px, 5vw, 56px);
        padding-bottom: clamp(60px, 8vw, 110px);
        min-height: 60vh;
        animation: up 0.6s var(--ease) both;
      }
      @keyframes up {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
      }
      @keyframes fd {
        from {
          opacity: 0;
        }
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.97);
        }
      }
      .st {
        animation: up 0.6s var(--ease) both;
        animation-delay: calc(var(--i, 0) * 70ms);
      }
      /* cards */
      .cards {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 36px;
      }
      .sc {
        background: #fff;
        border: 1px solid rgba(197, 164, 109, 0.4);
        padding: 22px;
      }
      .sc b {
        display: block;
        font:
          500 2.6rem/1 "Cormorant Garamond",
          serif;
        color: var(--forest);
      }
      .sc small {
        color: var(--mut);
        letter-spacing: 0.06em;
      }
      .g2 {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: clamp(24px, 4vw, 48px);
        margin-bottom: 40px;
        align-items: start;
      }
      .pnl {
        background: #fff;
        border: 1px solid rgba(197, 164, 109, 0.4);
        border-top: 3px solid var(--gold);
        padding: clamp(20px, 3vw, 32px);
      }
      .bk {
        background: #fff;
        border: 1px solid rgba(197, 164, 109, 0.4);
        padding: 20px clamp(18px, 3vw, 28px);
        margin-bottom: 14px;
        display: grid;
        gap: 14px;
        animation: up 0.5s var(--ease) both;
        animation-delay: calc(var(--i, 0) * 60ms);
      }
      .bk h3 {
        font-size: 1.6rem;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 26px;
        color: var(--mut);
        font-size: 0.92rem;
      }
      .meta b {
        font-weight: 500;
        color: var(--ink);
      }
      .act {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .badge {
        font: 500 0.68rem Jost;
        letter-spacing: 0.14em;
        padding: 5px 12px;
        border-radius: 2px;
        background: var(--cr);
        color: var(--forest);
        transition: background 0.3s;
      }
      .badge.PENDING {
        background: #f1e2bd;
      }
      .badge.CONFIRMED,
      .badge.PAID,
      .badge.COMPLETED {
        background: #d6e3d3;
      }
      .badge.CANCELLED,
      .badge.REFUNDED,
      .badge.NO-SHOW {
        background: #ecd3cf;
      }
      .empty {
        text-align: center;
        padding: clamp(36px, 6vw, 64px) 20px;
        background: #fff;
        border: 1px dashed rgba(197, 164, 109, 0.6);
      }
      .empty svg {
        width: 54px;
        color: var(--sage);
        opacity: 0.6;
        margin-bottom: 12px;
      }
      .empty h3 {
        margin-bottom: 6px;
      }
      .empty p {
        color: var(--mut);
        margin: 0 0 18px;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 20px;
      }
      .chip {
        background: none;
        border: 1px solid rgba(32, 58, 42, 0.3);
        border-radius: 2px;
        padding: 7px 16px;
        min-height: 40px;
        color: var(--forest);
        transition:
          background 0.3s,
          color 0.3s,
          border-color 0.3s;
      }
      .chip[aria-pressed="true"] {
        background: var(--forest);
        color: #fff;
        border-color: var(--forest);
      }
      select,
      input[type="text"],
      input[type="search"],
      input[type="password"],
      input[type="date"],
      input[type="email"] {
        font: inherit;
        padding: 11px 12px;
        border: 1px solid #c9bfa4;
        background: #fff;
        border-radius: 2px;
        color: var(--ink);
        width: 100%;
        transition:
          border-color 0.3s,
          box-shadow 0.3s;
      }
      select {
        width: auto;
      }
      .chips input {
        max-width: 280px;
        margin-left: auto;
      }
      input:focus,
      select:focus {
        border-color: var(--gold);
        outline: 0;
        box-shadow: 0 0 0 3px rgba(197, 164, 109, 0.3);
      }
      input[readonly] {
        background: var(--cr);
      }
      .tl {
        list-style: none;
        margin: 0;
        padding: 0 0 0 22px;
        border-left: 1px solid rgba(197, 164, 109, 0.6);
      }
      .tl li {
        position: relative;
        padding: 0 0 22px;
        animation: up 0.5s var(--ease) both;
        animation-delay: calc(var(--i, 0) * 90ms);
      }
      .tl li::before {
        content: "";
        position: absolute;
        left: -28px;
        top: 6px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--iv);
        border: 2px solid var(--gold);
      }
      .tl small {
        display: block;
        color: var(--mut);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        border: 1px solid rgba(197, 164, 109, 0.4);
      }
      th,
      td {
        text-align: left;
        padding: 14px 16px;
        border-bottom: 1px solid rgba(32, 58, 42, 0.1);
      }
      th {
        font: 500 0.7rem Jost;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--gd);
        background: #fcfaf5;
      }
      .note {
        font-size: 0.84rem;
        color: var(--mut);
        margin: 14px 0 0;
      }
      .rec {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }
      .rc {
        background: #fff;
        border: 1px solid rgba(197, 164, 109, 0.4);
        padding: 20px;
        display: grid;
        gap: 8px;
        align-content: start;
        transition:
          transform 0.4s var(--ease),
          border-color 0.3s;
      }
      .rc:hover {
        transform: translateY(-3px);
        border-color: var(--gold);
      }
      .rc h3 {
        font-size: 1.35rem;
      }
      .rc p {
        margin: 0;
        color: var(--mut);
        font-size: 0.9rem;
      }
      .heart {
        background: none;
        border: 1px solid rgba(32, 58, 42, 0.3);
        border-radius: 2px;
        width: 44px;
        height: 44px;
        font-size: 1.2rem;
        color: var(--gd);
        transition:
          background 0.3s,
          transform 0.3s;
      }
      .heart:hover {
        background: var(--cr);
      }
      .heart[aria-pressed="true"] {
        background: var(--forest);
        color: var(--gold);
      }
      .pf {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 24px;
        align-items: center;
        margin-bottom: 28px;
      }
      .av {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        background: var(--forest);
        color: var(--gold);
        display: grid;
        place-items: center;
        font:
          500 2rem "Cormorant Garamond",
          serif;
        box-shadow:
          0 0 0 4px var(--iv),
          0 0 0 5px var(--gold);
      }
      dl {
        display: grid;
        grid-template-columns: minmax(120px, 200px) 1fr;
        gap: 0;
        margin: 0;
      }
      dt,
      dd {
        margin: 0;
        padding: 12px 0;
        border-bottom: 1px solid rgba(32, 58, 42, 0.1);
      }
      dt {
        color: var(--mut);
        font-size: 0.9rem;
      }
      .f {
        margin-bottom: 16px;
      }
      .f label {
        display: block;
        font-size: 0.86rem;
        margin-bottom: 5px;
        color: var(--forest);
      }
      .ok {
        color: #2f6a40;
        animation: pop 0.4s var(--ease);
      }
      .er {
        color: #8a2f2f;
        font-size: 0.86rem;
        margin-top: 6px;
      }
      .tg {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 14px 0;
        border-bottom: 1px solid rgba(32, 58, 42, 0.1);
      }
      .tg input {
        width: 22px;
        height: 22px;
        accent-color: var(--forest);
      }
      .str {
        margin: -6px 0 16px;
        font-size: 0.84rem;
        color: var(--mut);
      }
      .segs {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 5px;
        margin: 6px 0;
      }
      .segs i {
        height: 4px;
        border-radius: 2px;
        background: #ddd5c0;
        transition: background-color 0.35s;
      }
      .segs i.on {
        background: var(--c, #a34a3c);
      }
      .rq {
        list-style: none;
        padding: 0;
        margin: 6px 0 0;
        display: grid;
        gap: 3px;
      }
      .rq li {
        transition: color 0.3s;
      }
      .rq li.y {
        color: var(--forest);
      }
      .rq li.y::before {
        content: "\2713 ";
        animation: pop 0.35s var(--ease);
      }
      .rq li:not(.y)::before {
        content: "\25CB ";
      }
      .nt {
        display: flex;
        gap: 12px;
        padding: 14px 0;
        border-bottom: 1px solid rgba(32, 58, 42, 0.1);
      }
      .nt i {
        flex: none;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-top: 8px;
        border: 2px solid var(--gold);
      }
      .nt.u i {
        background: var(--gold);
      }
      .nt small {
        display: block;
        color: var(--mut);
      }
      .lk {
        background: none;
        border: 0;
        padding: 0;
        color: var(--forest);
        text-decoration: underline;
        font: inherit;
        cursor: pointer;
      }
      .lk:hover {
        color: var(--gd);
      }
      .stars {
        color: var(--gd);
        letter-spacing: 0.1em;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .rate {
        display: inline-flex;
        flex-direction: row-reverse;
        position: relative;
      }
      .rate input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
      }
      .rate label {
        font-size: 2.4rem;
        line-height: 1;
        padding: 2px 4px;
        color: #c9bfa4;
        cursor: pointer;
        transition:
          color 0.2s,
          transform 0.2s;
      }
      .rate label:hover {
        transform: scale(1.1);
      }
      .rate input:checked ~ label,
      .rate label:hover,
      .rate label:hover ~ label {
        color: var(--gold);
      }
      .rate input:focus-visible + label {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
      #pr {
        display: none;
      }
      @media print {
        body > *:not(#pr) {
          display: none !important;
        }
        #pr {
          display: block;
          color: #000;
          background: #fff;
          font:
            14px/1.6 Jost,
            Arial,
            sans-serif;
          padding: 0;
        }
        #pr h1 {
          font-size: 26px;
          color: #203a2a;
        }
        #pr h2 {
          font-size: 22px;
          margin: 26px 0 4px;
          color: #203a2a;
        }
        .prh {
          display: flex;
          gap: 16px;
          align-items: center;
          border-bottom: 2px solid #c5a46d;
          padding-bottom: 14px;
        }
        .prh img {
          width: 64px;
          height: 64px;
          border-radius: 50%;
        }
        .prh p {
          margin: 0;
          font-size: 13px;
        }
        .prs {
          margin: 0 0 14px;
        }
        .prt {
          width: 100%;
          border-collapse: collapse;
          border: 0;
        }
        .prt th,
        .prt td {
          padding: 9px 6px;
          border-bottom: 1px solid #ddd;
          background: none;
          text-align: left;
          font-size: 14px;
          letter-spacing: 0;
          text-transform: none;
          color: #000;
        }
        .prt th {
          width: 32%;
          font-weight: 600;
        }
        .prn {
          margin: 18px 0 0;
          padding-left: 18px;
          font-size: 13px;
        }
        .prf {
          margin-top: 28px;
          font-size: 12px;
          color: #555;
        }
      }
      dialog {
        border: 1px solid var(--gold);
        border-radius: 4px;
        background: var(--iv);
        width: min(520px, calc(100% - 24px));
        padding: 28px;
        color: var(--ink);
        opacity: 0;
        transform: translateY(16px) scale(0.98);
        transition:
          opacity 0.35s var(--ease),
          transform 0.35s var(--ease),
          overlay 0.35s allow-discrete,
          display 0.35s allow-discrete;
      }
      dialog[open] {
        opacity: 1;
        transform: none;
      }
      dialog::backdrop {
        background: rgba(20, 39, 28, 0);
        transition:
          background 0.35s,
          overlay 0.35s allow-discrete,
          display 0.35s allow-discrete;
      }
      dialog[open]::backdrop {
        background: rgba(20, 39, 28, 0.6);
      }
      @starting-style {
        dialog[open] {
          opacity: 0;
          transform: translateY(16px) scale(0.98);
        }
        dialog[open]::backdrop {
          background: rgba(20, 39, 28, 0);
        }
      }
      dialog h3 {
        font-size: 1.8rem;
        margin-bottom: 12px;
      }
      .dr {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        flex-wrap: wrap;
        margin-top: 20px;
      }
      .rd {
        display: block;
        padding: 7px 0;
      }
      .rd input {
        margin-right: 10px;
        accent-color: var(--forest);
      }
      .badge.UNPAID {
        background: #fffbeb;
        color: #b45309;
        border: 1px solid #fde68a;
      }
      .badge.PARTIALLY_PAID {
        background: #eff6ff;
        color: #1d4ed8;
        border: 1px solid #bfdbfe;
      }
      .badge.PAID {
        background: #f0fdf4;
        color: #15803d;
        border: 1px solid #bbf7d0;
      }
      .badge.FORFEITED {
        background: #fef2f2;
        color: #b91c1c;
        border: 1px solid #fecaca;
      }
      .demo-banner {
        background: #fffbeb;
        border: 1px solid #fef3c7;
        color: #92400e;
        padding: 10px 14px;
        border-radius: 4px;
        font-weight: 600;
        font-size: 0.85rem;
        margin-bottom: 16px;
        text-align: center;
      }
      .pay-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 14px 0;
      }
      .pay-card {
        background: #fff;
        border: 2px solid #ddd;
        border-radius: 6px;
        padding: 14px;
        cursor: pointer;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .pay-card:hover {
        border-color: var(--gold);
      }
      .pay-card.active {

      @media (prefers-reduced-motion: reduce) {
