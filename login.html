<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bella Vista Oasis Spa | Login</title>
    <meta name="description" content="Log in to your Bella Vista Oasis Spa account to reserve an appointment." />
    <link rel="canonical" href="login.html" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="assets/logo/logo.png" type="image/png" />
    <script src="js/boot.js"></script>
    <link rel="stylesheet" href="css/fonts.css?v=m1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tokens.css?v=m1" />
    <link rel="stylesheet" href="css/style.css?v=m1" />
  </head>
  <body data-page="login">
    <main id="main">
      <section class="auth split" data-auth>
        <div class="aimg">
          <div class="acap">
            <span>Bella Vista Oasis Spa</span>
            <p>Your moment of calm begins here.</p>
          </div>
        </div>
        <div class="apane">
          <div class="acard">
            <h1>Login</h1>
            <form id="loginForm" novalidate>
              <div class="f" data-f="email">
                <label for="email">Gmail address</label>
                <input id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="Enter email here" required />
                <div class="err">Please enter a valid Gmail address.</div>
              </div>
              <div data-pw="password" data-label="Password" data-ac="current-password" data-ph="Enter password here"></div>
              <a class="forgot" href="forgot.html">Forgot password?</a>
              <button class="btn" type="submit" id="go">Login</button>
            </form>
            <p class="alinks">
              <span>Don't have an account yet? <a href="register.html" data-to-register>Register here.</a></span>
            </p>
          </div>
        </div>
      </section>
    </main>
    <script src="js/phone.js?v=m1"></script>
    <script src="js/data.js?v=m1"></script>
    <script src="js/notify.js?v=m1"></script>
    <script src="js/auth.js?v=m1"></script>
    <script src="js/booking.js?v=m1"></script>
    <script src="js/main.js?v=m1"></script>
  </body>
</html>
