<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bella Vista Oasis Spa | Login</title>
    <meta name="description" content="Log in to your Bella Vista Oasis Spa account to reserve an appointment." />
    <link rel="canonical" href="login.html" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="assets/logo/logo.png" type="image/png" />
    <script>
      document.documentElement.classList.add("js");
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=20261113_refundtiming" />
  </head>
  <body data-page="login">
    <main id="main">
      <section class="auth" data-auth>
        <div class="authbg" role="presentation"></div>
        <div class="acard">
          <img class="alogo" src="assets/logo/logo.png" width="72" height="72" alt="Bella Vista Oasis Spa" />
          <h1>Welcome Back</h1>
          <p class="asub">Log in to reserve your experience.</p>
          <form id="loginForm" novalidate>
            <div class="f" data-f="email">
              <label for="email">Gmail address</label>
              <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required />
              <div class="err">Please enter a valid Gmail address.</div>
            </div>
            <div data-pw="password" data-label="Password" data-ac="current-password"></div>
            <button class="btn" type="submit" id="go">Login</button>
          </form>
          <div class="alinks">
            <a href="forgot.html">Forgot Password?</a>
            <span>
              Don't have an account?
              <a href="register.html" data-to-register>Create account</a>
            </span>
          </div>
        </div>
      </section>
    </main>
    <script src="js/data.js?v=20261113_refundtiming"></script>
    <script src="js/notify.js?v=20261113_refundtiming"></script>
    <script src="js/auth.js?v=20261113_refundtiming"></script>
    <script src="js/booking.js?v=20261113_refundtiming"></script>
    <script src="js/main.js?v=20261113_refundtiming"></script>
  </body>
</html>
