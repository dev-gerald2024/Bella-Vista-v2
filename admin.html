<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin | Bella Vista Oasis Spa</title>
    <meta name="description" content="Bella Vista Oasis Spa administration dashboard." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="assets/logo/logo.png" type="image/png" />
    <link rel="stylesheet" href="css/fonts.css?v=m1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tokens.css?v=m1" />
    <link rel="stylesheet" href="css/admin.css?v=m1" />
  </head>
  <body>
    <aside class="sb" id="sb" aria-label="Admin navigation">
      <div class="brand">
        <div class="brand-title">
          BELLA VISTA
          <br />
          OASIS SPA
        </div>
        <span class="brand-badge">Admin</span>
      </div>
      <nav class="sn" id="sn"></nav>
      <div class="ft">
        <div>
          <b id="who">Admin</b>
          <small>Administrator</small>
        </div>
        <button type="button" id="out">Logout</button>
      </div>
    </aside>
    <div id="sb-backdrop" class="sb-backdrop"></div>
    <div class="mn">
      <header class="tb">
        <button class="bg" id="bg" aria-label="Open menu" aria-expanded="false" aria-controls="sb">&#9776;</button>
        <h1 id="ttl">Dashboard</h1>
      </header>
      <main class="ct" id="ct"></main>
    </div>
    <dialog id="cvd" aria-labelledby="cvt">
      <h3 id="cvt">Customer Profile</h3>
      <div id="cvb"></div>
      <div class="dr"><button type="button" class="btn s" data-a="closecv">Close</button></div>
    </dialog>
    <dialog id="dlg" aria-labelledby="dt">
      <h3 id="dt"></h3>
      <form id="df" novalidate>
        <div id="fl"></div>
        <div class="dr">
          <button type="button" class="btn s" id="dc">Cancel</button>
          <button class="btn" type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <!-- Phase 5 Resource Management Dialogs -->
    <dialog id="asgn-dlg" aria-labelledby="asgnt">
      <h3 id="asgnt">Assign Room & Therapist</h3>
      <form id="asgn-form" novalidate>
        <div id="asgn-body"></div>
        <div class="dr">
          <button type="button" class="btn s" data-a="closeasgn">Cancel</button>
          <button class="btn" type="submit">Save Assignment</button>
        </div>
      </form>
    </dialog>
    <dialog id="maint-dlg" aria-labelledby="maintt">
      <h3 id="maintt">Schedule Room Maintenance</h3>
      <form id="maint-form" novalidate>
        <div id="maint-body"></div>
        <div class="dr">
          <button type="button" class="btn s" data-a="closemaint">Cancel</button>
          <button class="btn" type="submit">Save Maintenance</button>
        </div>
      </form>
    </dialog>
    <dialog id="clean-dlg" aria-labelledby="cleant">
      <h3 id="cleant">Update Room Cleaning Status</h3>
      <form id="clean-form" novalidate>
        <div id="clean-body"></div>
        <div class="dr">
          <button type="button" class="btn s" data-a="closeclean">Cancel</button>
          <button class="btn" type="submit">Update Status</button>
        </div>
      </form>
    </dialog>
    <dialog id="sched-dlg" aria-labelledby="schedt" style="width: min(680px, calc(100% - 24px))">
      <h3 id="schedt">Therapist Schedule & Shift Management</h3>
      <div id="sched-body" style="margin: 16px 0; max-height: 65vh; overflow-y: auto"></div>
      <div class="dr"><button type="button" class="btn s" data-a="closesched">Close</button></div>
    </dialog>

    <!-- Payment & Transaction Dialogs -->
    <dialog id="cash-dlg" aria-labelledby="casht">
      <h3 id="casht">Confirm Cash Payment</h3>
      <div id="cash-body"></div>
      <div class="dr">
        <button type="button" class="btn s" data-a="closecash">Cancel</button>
        <button class="btn" type="button" id="cash-confirm-btn" style="background: var(--forest); color: var(--iv)">
          Confirm Cash Receipt
        </button>
      </div>
    </dialog>
    <dialog id="refund-dlg" aria-labelledby="refundt">
      <h3 id="refundt">Process Refund</h3>
      <form id="refund-form" novalidate>
        <div id="refund-body"></div>
        <div class="dr">
          <button type="button" class="btn s" data-a="closerefund">Cancel</button>
          <button class="btn dg" type="submit">Issue Refund</button>
        </div>
      </form>
    </dialog>
    <dialog id="rec-dlg" aria-labelledby="rect" style="width: min(600px, calc(100% - 24px))">
      <h3 id="rect">Digital Payment Receipt</h3>
      <div id="rec-body" style="margin: 14px 0"></div>
      <div class="dr">
        <button type="button" class="btn s" data-a="closerec">Close</button>
        <button class="btn" type="button" id="rec-prn-btn" style="background: var(--forest); color: var(--iv)">
          Print Receipt
        </button>
      </div>
    </dialog>
    <script src="js/notify.js?v=m1"></script>
    <script src="js/auth.js?v=m1"></script>
    <script src="js/db.js?v=m1"></script>
    <script src="js/phone.js?v=m1"></script>
    <script src="js/admin.js?v=m1"></script>
  </body>
</html>
